services:
  postgres:
    image: postgres:16
    container_name: postgres_local
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Glory_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  postgres_product:
    image: postgres:16
    container_name: postgres_product_local
    environment:
      POSTGRES_DB: product_catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Glory_123
    ports:
      - "5433:5432"
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
  postgres_product_data: