spring:
  application:
    name: product-catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5433/product_catalog_db
    username: postgres
    password: Glory_123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /docs
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
  api-docs:
    path: /api-docs
    enabled: true
  packages-to-scan: com.glory.productcatalogservice.controller
  paths-to-match: /api/**